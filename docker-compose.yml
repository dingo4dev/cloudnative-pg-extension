version: '3.8'

services:
  # PostgreSQL with Oracle FDW
  postgres:
    build:
      context: .
      args:
        PG_MAJOR: 18
        PG_VERSION: 18.4
        ORACLE_VERSION: 19.25.0.0.0
        ORACLE_FDW_VERSION: ORACLE_FDW_2_7_0
    image: postgres-oracle-fdw:18.4
    container_name: postgres-oracle-fdw
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postgres_network

  # Optional: Oracle Database (for testing FDW connectivity)
  # Uncomment if you want to run a local Oracle database for testing
  # oracle:
  #   image: container-registry.oracle.com/database/express:21.3.0-xe
  #   container_name: oracle-xe
  #   environment:
  #     ORACLE_PWD: ${ORACLE_PASSWORD:-OraclePassword123}
  #   ports:
  #     - "1521:1521"
  #     - "5500:5500"
  #   volumes:
  #     - oracle_data:/opt/oracle/oradata
  #   networks:
  #     - postgres_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/${ORACLE_PASSWORD:-OraclePassword123}@localhost:1521/XE"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

volumes:
  postgres_data:
    driver: local
  # oracle_data:
  #   driver: local

networks:
  postgres_network:
    driver: bridge
