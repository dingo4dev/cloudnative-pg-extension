apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-oracle-fdw
  namespace: default
spec:
  instances: 3
  imageName: ghcr.io/dingo4dev/postgres-container:18.4
  
  postgresql:
    parameters:
      shared_preload_libraries: "oracle_fdw,pg_cron"
      cron.database_name: "app"
      max_connections: "100"
      shared_buffers: "256MB"
    
  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS oracle_fdw;
        - CREATE EXTENSION IF NOT EXISTS pg_cron;
        - CREATE EXTENSION IF NOT EXISTS anon;
        - ALTER DATABASE app SET anon.transparent_dynamic_masking TO true;
  
  storage:
    size: 10Gi
    storageClass: standard
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  # Backup configuration (optional)
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://my-backup-bucket/postgres-oracle-fdw
  #     s3Credentials:
  #       accessKeyId:
  #         name: aws-credentials
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: aws-credentials
  #         key: SECRET_ACCESS_KEY
  #     wal:
  #       compression: gzip
  #   retentionPolicy: "30d"
  
  monitoring:
    enablePodMonitor: true
